name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore BPG_CMS_BE/BPG-CMS.sln

    - name: Build Backend
      run: dotnet build BPG_CMS_BE/BPG-CMS.sln --configuration Release --no-restore

    - name: Run Backend Tests
      run: dotnet test BPG_CMS_BE/BPG-CMS.sln --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: BPG_CMS_FE/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd BPG_CMS_FE
        npm ci

    - name: Build & Compile Check Frontend
      run: |
        cd BPG_CMS_FE
        npm run build

